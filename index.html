<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restoration Portal</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1d1d1b;--mut:#6b6a63;--line:#dedcd4;--acc:#2f5d3a;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#222220;--text:#efeee9;--mut:#9a988f;--line:#3a3935;--acc:#6fbf82;--bad:#f2867f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:18px;margin:0}
main{max-width:900px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.row{cursor:pointer}
.row:hover{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}
.lbl{font-size:12px;color:var(--mut)}
.val{font-weight:600}
.bad{color:var(--bad)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
h3{margin:18px 0 8px;font-size:15px}
input,select,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);width:100%;margin-bottom:10px}
button{background:var(--acc);color:#fff;border:0;cursor:pointer;width:auto}
button.ghost{background:none;color:var(--text);border:1px solid var(--line)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:right;padding:8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mut);font-weight:500}
.msg{color:var(--bad);min-height:1.4em}
.hide{display:none}
</style>
</head>
<body>
<header><h1>Restoration Portal</h1><button id="out" class="ghost hide">Sign out</button></header>
<main>
  <section id="login" class="card hide" style="max-width:380px;margin:40px auto">
    <h2 style="margin-top:0">Sign in</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
    <button id="go">Sign in</button>
    <p id="err" class="msg"></p>
  </section>
  <section id="list" class="hide">
    <div class="top"><h2 style="margin:0">Projects</h2><button id="newbtn">+ New project</button></div>
    <div id="projects"></div>
  </section>
  <section id="newproj" class="hide">
    <button id="cancel" class="ghost">&larr; Cancel</button>
    <h2>New project</h2>
    <div class="card">
      <h3 style="margin-top:0">Customer</h3>
      <select id="c_sel"></select>
      <div id="newc">
        <input id="c_name" placeholder="Customer name">
        <div class="two"><input id="c_email" type="email" placeholder="Email (optional)"><input id="c_phone" placeholder="Phone (optional)"></div>
      </div>
      <h3>Vehicle</h3>
      <div class="two">
        <input id="v_make" list="makes" placeholder="Make (e.g. Land Rover)">
        <input id="v_model" placeholder="Model (e.g. Series IIA 88)">
        <input id="v_year" type="number" placeholder="Year">
        <input id="v_vin" placeholder="Chassis / VIN (optional)">
      </div>
      <datalist id="makes"><option>Land Rover</option><option>Range Rover</option><option>Porsche</option></datalist>
      <h3>Project</h3>
      <input id="p_name" placeholder="Project name (e.g. 1967 Series IIA restoration)">
      <div class="two">
        <input id="p_code" placeholder="Project code">
        <select id="p_template"></select>
        <input id="p_quote" type="number" placeholder="Quote total, ex-GST ($)">
        <input id="p_deposit" type="number" value="20" placeholder="Deposit %">
      </div>
      <div class="lbl">Start date (optional)</div>
      <input id="p_start" type="date">
      <button id="create">Create project</button>
      <p id="nperr" class="msg"></p>
    </div>
  </section>
  <section id="detail" class="hide">
    <button id="back" class="ghost">&larr; All projects</button>
    <h2 id="dname"></h2>
    <div class="card wrap"><table><thead><tr>
      <th>Stage</th><th>Status</th><th>Budget</th><th>Actual</th><th>Remaining</th>
    </tr></thead><tbody id="stages"></tbody></table></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://xzfcwhadpdnkbsskoviu.supabase.co";
const SUPABASE_KEY = "sb_publishable_xg-cm8IsOEmLqGy0NtO8Sg_tLZMPx9k";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const money = n => new Intl.NumberFormat("en-AU", {style:"currency", currency:"AUD", maximumFractionDigits:0}).format(n || 0);
const show = name => ["login","list","detail","newproj"].forEach(s => $(s).classList.toggle("hide", s !== name));

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}
function stat(label, value, bad) {
  const d = el("div");
  d.append(el("div", label, "lbl"), el("div", value, "val" + (bad ? " bad" : "")));
  return d;
}

async function loadProjects() {
  show("list");
  $("out").classList.remove("hide");
  const box = $("projects");
  box.textContent = "Loading...";
  const { data, error } = await sb.from("project_financials").select("*").order("code");
  box.textContent = "";
  if (error) { box.append(el("p", error.message, "msg")); return; }
  if (!data.length) {
    box.append(el("p", "No projects to show. If you expected some, your account may not be set up as owner or staff yet.", "lbl"));
    return;
  }
  data.forEach(p => {
    const card = el("div", undefined, "card row");
    card.append(el("strong", (p.code ? p.code + " - " : "") + p.name));
    const g = el("div", undefined, "grid");
    g.append(
      stat("Quote", money(p.quote_total)),
      stat("Budget cost", money(p.total_budget)),
      stat("Actual cost", money(p.total_actual)),
      stat("Margin to date", money(p.margin_to_date), p.margin_to_date < 0),
      stat("Status", (p.status || "").replace(/_/g, " "))
    );
    card.append(g);
    card.onclick = () => openProject(p);
    box.append(card);
  });
}

async function openProject(p) {
  show("detail");
  $("dname").textContent = (p.code ? p.code + " - " : "") + p.name;
  const body = $("stages");
  body.textContent = "";
  const { data, error } = await sb.from("facet_financials").select("*")
    .eq("project_id", p.project_id).order("sort_order");
  if (error) { body.append(el("tr")).append(el("td", error.message, "msg")); return; }
  data.forEach(f => {
    const budget = f.budget_parts + f.budget_sublet + f.budget_labour;
    const actual = f.actual_parts + f.actual_sublet + f.actual_labour;
    const tr = el("tr");
    tr.append(el("td", f.name), el("td", f.status.replace(/_/g, " ")),
      el("td", money(budget)), el("td", money(actual)),
      el("td", money(budget - actual), (budget - actual) < 0 ? "bad" : ""));
    body.append(tr);
  });
}

function fillSelect(sel, rows, firstLabel) {
  sel.textContent = "";
  if (firstLabel) { const o = el("option", firstLabel); o.value = ""; sel.append(o); }
  rows.forEach(r => { const o = el("option", r.name); o.value = r.id; sel.append(o); });
}

async function openNew() {
  show("newproj");
  $("nperr").textContent = "";
  const [cu, tp, pc] = await Promise.all([
    sb.from("customers").select("id,name").order("name"),
    sb.from("project_templates").select("id,name").order("name"),
    sb.from("projects").select("id", { count: "exact", head: true })
  ]);
  fillSelect($("c_sel"), cu.data || [], "+ New customer");
  fillSelect($("p_template"), tp.data || []);
  $("newc").classList.remove("hide");
  $("p_code").value = new Date().getFullYear() + "-" + String((pc.count || 0) + 1).padStart(3, "0");
}

$("newbtn").onclick = openNew;
$("cancel").onclick = () => show("list");
$("c_sel").onchange = () => $("newc").classList.toggle("hide", $("c_sel").value !== "");

$("create").onclick = async () => {
  const err = m => { $("nperr").textContent = m; };
  err("");
  const name = $("p_name").value.trim(), quote = parseFloat($("p_quote").value), tpl = $("p_template").value;
  const make = $("v_make").value.trim(), model = $("v_model").value.trim();
  if (!name || !(quote > 0) || !tpl) return err("Please fill in the project name, template and quote.");
  if (!make || !model) return err("Please enter the vehicle make and model.");
  $("create").disabled = true;
  try {
    let cid = $("c_sel").value;
    if (!cid) {
      const cn = $("c_name").value.trim();
      if (!cn) return err("Enter a customer name or pick an existing customer.");
      const r = await sb.from("customers").insert({
        name: cn, email: $("c_email").value.trim() || null, phone: $("c_phone").value.trim() || null
      }).select("id").single();
      if (r.error) return err(r.error.message);
      cid = r.data.id;
    }
    const v = await sb.from("vehicles").insert({
      customer_id: cid, make, model,
      year: parseInt($("v_year").value) || null, chassis_vin: $("v_vin").value.trim() || null
    }).select("id").single();
    if (v.error) return err(v.error.message);
    const p = await sb.from("projects").insert({
      code: $("p_code").value.trim() || null, name, vehicle_id: v.data.id, customer_id: cid,
      quote_total: quote, deposit_pct: parseFloat($("p_deposit").value) || 0,
      start_date: $("p_start").value || null, status: "quoted"
    }).select("id,code,name").single();
    if (p.error) return err(p.error.message);
    const f = await sb.rpc("create_project_from_template", { p_project: p.data.id, p_template: tpl });
    if (f.error) {
      await sb.from("projects").delete().eq("id", p.data.id);
      return err(f.error.message);
    }
    ["c_name","c_email","c_phone","v_make","v_model","v_year","v_vin","p_name","p_quote","p_start"].forEach(i => $(i).value = "");
    openProject({ project_id: p.data.id, code: p.data.code, name: p.data.name });
  } finally {
    $("create").disabled = false;
  }
};

$("go").onclick = async () => {
  $("err").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pass").value });
  if (error) $("err").textContent = error.message; else loadProjects();
};
$("pass").onkeydown = e => { if (e.key === "Enter") $("go").click(); };
$("back").onclick = () => show("list");
$("out").onclick = async () => { await sb.auth.signOut(); $("out").classList.add("hide"); show("login"); };

sb.auth.getSession().then(({ data }) => data.session ? loadProjects() : show("login"));
</script>
</body>
</html>
